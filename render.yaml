# Render Blueprint for BOLTIX EMPIRE
# Dashboard -> New -> Blueprint -> pick this repo. Render creates the database,
# the web service, wires DATABASE_URL, and asks you for the two secrets below.

databases:
  - name: boltix-db
    databaseName: boltix
    user: boltix
    plan: free                # NOTE: free Postgres expires 30 days after creation (see README)
    region: oregon            # must match the web service region
    ipAllowList: []           # private network only (the bot reaches it internally)

services:
  - type: web
    name: boltix-empire
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      # --- secrets: Render prompts you for these when you create the Blueprint ---
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS          # your numeric Telegram id(s), comma separated. Send /id to the bot to find it.
        sync: false

      # --- database (wired automatically) ---
      - key: DATABASE_URL
        fromDatabase:
          name: boltix-db
          property: connectionString

      # --- the two channels users must join ---
      - key: OWNER_USERNAME
        value: swiftSecurityalert
      - key: CHANNEL_1_URL
        value: https://t.me/Hoshigami_anime
      - key: CHANNEL_2_URL
        value: https://t.me/Boltix_labs

      # --- tuning ---
      - key: REFERRALS_REQUIRED
        value: "5"
      - key: CLEAN_FILENAMES
        value: "true"
      - key: KEEP_ALIVE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.8"
      # RENDER_EXTERNAL_URL is injected by Render automatically and is used as the webhook URL.
